[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Every route is prerendered (next.config.ts sets output: "export"), so Netlify
# serves plain files — no Next runtime, no serverless functions to drift.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
