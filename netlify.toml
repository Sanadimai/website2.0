[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Every route is prerendered (next.config.ts sets output: "export"), so Netlify
# serves plain files — no Next runtime, no serverless functions to drift.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# /index.html served a full duplicate of / with its own 200. One canonical URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Markdown for Agents — Accept: text/markdown returns the markdown edition.
[[edge_functions]]
  function = "markdown"
  path = "/"

[[edge_functions]]
  function = "markdown"
  path = "/ar"

# MCP server over Streamable HTTP.
[[edge_functions]]
  function = "mcp"
  path = "/mcp"

# A2A agent endpoint.
[[edge_functions]]
  function = "a2a"
  path = "/a2a"

# Live founding-slot availability (Netlify Blobs backed).
[[edge_functions]]
  function = "availability"
  path = "/api/v1/availability"

# RFC 8288 Link headers: agent-discoverable resources, advertised before an
# agent has to parse any HTML.


# JSON discovery documents must not be sniffed as anything else.
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    access-control-allow-origin = "*"
    cache-control = "public, max-age=3600"

[[headers]]
  for = "/*.md"
  [headers.values]
    content-type = "text/markdown; charset=utf-8"
    access-control-allow-origin = "*"

# RFC 8288 Link headers — agent-discoverable resources, advertised before an
# agent has to parse any HTML. Literal TOML strings: the values contain quotes.
[[headers]]
  for = "/"
  [headers.values]
    Link = '</index.md>; rel="alternate"; type="text/markdown", </llms.txt>; rel="describedby"; type="text/markdown", </.well-known/agents/index.json>; rel="service-desc"; type="application/json", </.well-known/agent-skills/index.json>; rel="service-meta"; type="application/json", </ar>; rel="alternate"; hreflang="ar-AE", </sitemap.xml>; rel="sitemap"; type="application/xml", </privacy>; rel="privacy-policy", </terms>; rel="terms-of-service", <https://sanad.im/>; rel="canonical"'

[[headers]]
  for = "/ar"
  [headers.values]
    Link = '</ar/index.md>; rel="alternate"; type="text/markdown", </llms.txt>; rel="describedby"; type="text/markdown", </.well-known/agents/index.json>; rel="service-desc"; type="application/json", </.well-known/agent-skills/index.json>; rel="service-meta"; type="application/json", </>; rel="alternate"; hreflang="en-AE", </sitemap.xml>; rel="sitemap"; type="application/xml", </ar/privacy>; rel="privacy-policy", </ar/terms>; rel="terms-of-service", <https://sanad.im/ar>; rel="canonical"'

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    content-type = "application/linkset+json"
    access-control-allow-origin = "*"

[[headers]]
  for = "/auth.md"
  [headers.values]
    content-type = "text/markdown; charset=utf-8"
    access-control-allow-origin = "*"

[[headers]]
  for = "/api/*"
  [headers.values]
    access-control-allow-origin = "*"
    cache-control = "public, max-age=300"
